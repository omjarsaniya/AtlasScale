[project]
name = "atlasscale"
version = "0.1.0"
description = "A job execution and state management system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
